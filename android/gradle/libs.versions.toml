[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose-bom = "2025.10.01"
activity-compose = "1.8.2"
androidx-core = "1.17.0"
androidx-appcompat = "1.7.1"
material = "1.13.0"
recyclerview = "1.4.0"
vanniktech-publish = "0.34.0"
binary-compatibility-validator = "0.18.1"
compose-lints = "1.4.2"
junit4 = "4.13.2"
robolectric = "4.16.1"
roborazzi = "1.51.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
espresso = "3.7.0"
accessibility-test-framework = "4.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-lints = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "compose-lints" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
