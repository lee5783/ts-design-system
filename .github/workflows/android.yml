name: android

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_WORKERS: 2

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - id: changes
        run: make ci-changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  build:
    name: assemble, lint, apiCheck
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: make android-build
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: android/*/build/reports
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: test (unit, behaviour, snapshot render)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
      - run: make android-test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/*/build/reports/tests
            android/*/build/test-results
          if-no-files-found: ignore
          retention-days: 14

  android-ok:
    if: always()
    needs: [changes, build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make ci-required
        env:
          NEEDS: ${{ toJSON(needs) }}
