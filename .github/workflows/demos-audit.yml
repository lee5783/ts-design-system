name: demos-audit

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-audit:
    name: ios-audit (${{ matrix.demo }})
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'a11y-audit') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'a11y-audit'))
    runs-on: macos-26
    timeout-minutes: 150
    concurrency:
      group: demos-audit-${{ matrix.demo }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        demo: [swiftui, uikit]
    env:
      DEMO: ${{ matrix.demo }}
      IOS_RUNTIMES: pinned
    steps:
      - uses: actions/checkout@v7
      - run: make ci-xcode
      - run: make ci-ios-simulator
      - uses: actions/cache@v6
        with:
          path: .build/xcode-demos/SourcePackages
          key: spm-demos-${{ runner.os }}-${{ hashFiles('.xcode-version', 'Package.resolved') }}
      - run: make "demo-ios-$DEMO-audit"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-audit-${{ matrix.demo }}
          path: .build/xcode-demos/Logs/Test
          if-no-files-found: ignore
          retention-days: 14
