name: codegen-check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codegen-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tools:
    name: tools, actionlint, codegen, ds-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make tools-test
      - run: make actionlint
      - run: make codegen-check
      - run: make ds-sync

  codegen-check-ok:
    if: always()
    needs: [tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make ci-required
        env:
          NEEDS: ${{ toJSON(needs) }}
