name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_WORKERS: 2

jobs:
  verify:
    name: on master, matches VERSION and CHANGELOG.md
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make release-verify
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}

  codegen-check:
    needs: verify
    uses: ./.github/workflows/codegen-check.yml

  ios:
    needs: verify
    uses: ./.github/workflows/ios.yml

  android:
    needs: verify
    uses: ./.github/workflows/android.yml

  demos:
    needs: verify
    uses: ./.github/workflows/demos.yml

  publish-android:
    name: publish Android to GitHub Packages
    needs: [codegen-check, ios, android, demos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make tools-deps
      - run: make android-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-packages:
    name: build Android demo APKs and library AARs
    needs: [codegen-check, ios, android, demos]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: make release-android-packages
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: .build/release/assets
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub release with packages
    needs: [publish-android, android-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: .build/release/assets
      - run: make tools-deps
      - run: make release-github
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
