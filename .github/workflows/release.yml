name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release (X.Y.Z). It must equal VERSION on master.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_WORKERS: 2

jobs:
  verify:
    name: on master, matches VERSION and CHANGELOG.md, not tagged yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make release-verify
        env:
          TAG: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}

  codegen-check:
    needs: verify
    uses: ./.github/workflows/codegen-check.yml

  ios:
    needs: verify
    uses: ./.github/workflows/ios.yml

  android:
    needs: verify
    uses: ./.github/workflows/android.yml

  demos:
    needs: verify
    uses: ./.github/workflows/demos.yml

  publish-android:
    name: publish Android to GitHub Packages
    needs: [codegen-check, ios, android, demos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make tools-deps
      - run: make android-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: tag and GitHub release
    needs: publish-android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: make tools-deps
      - run: make release-github
        env:
          TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
